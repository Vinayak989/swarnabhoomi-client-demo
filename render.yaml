services:
  - type: web
    name: swarnabhoomi-demo
    runtime: docker
    region: singapore
    # Paid compute is required to attach persistent storage.
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: swarnabhoomi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: H2_FILE_PATH
        value: /var/data/swarnabhoomi
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_ACCESS_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_REMINDER_TEMPLATE
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: mr
      - key: REMINDER_POLL_INTERVAL_MS
        value: "15000"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: GOOGLE_CLOUD_TTS_CREDENTIALS_JSON
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: DATABASE_BACKUP_ENABLED
        value: "false"
