services:
  - type: web
    name: swarnabhoomi-demo
    runtime: docker
    region: singapore
    # Free preview hosting; filesystem data is temporary on this plan.
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        value: swarnabhoomi
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        value: DISABLED
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: APP_ACCESS_ENABLED
        value: "false"
