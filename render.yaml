services:
  - type: web
    name: swarnabhoomi-demo
    runtime: docker
    region: singapore
    # Paid compute is required to attach persistent storage.
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: swarnabhoomi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: H2_FILE_PATH
        value: /var/data/swarnabhoomi
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_ACCESS_ENABLED
        value: "false"
      - key: APP_ACCESS_USERNAME
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: REMINDER_POLL_INTERVAL_MS
        value: "15000"
      - key: WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_SUBJECT
        value: https://swarnabhoomi-demo.onrender.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: ADMIN_BOOTSTRAP_MOBILE
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SESSION_TOKEN
        sync: false
      - key: DATABASE_BACKUP_ENABLED
        value: "false"
