services:
  - type: web
    name: swarnabhoomi-demo
    runtime: docker
    region: singapore
    # Paid compute is required to attach persistent storage.
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: swarnabhoomi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: H2_FILE_PATH
        value: /var/data/swarnabhoomi
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_ACCESS_ENABLED
        value: "false"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_REMINDER_TEMPLATE
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: mr
      - key: REMINDER_POLL_INTERVAL_MS
        value: "15000"
