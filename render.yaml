services:
  - type: web
    name: swarnabhoomi-demo
    runtime: docker
    region: singapore
    # Free preview hosting; filesystem data is temporary on this plan.
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DATABASE
        value: swarnabhoomi
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSL_MODE
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: APP_ACCESS_ENABLED
        value: "false"
