services:
  - type: web
    name: swarnabhoomi-demo
    runtime: docker
    region: singapore
    # Paid compute is required to attach persistent storage.
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: swarnabhoomi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: H2_FILE_PATH
        value: /var/data/swarnabhoomi
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_ACCESS_ENABLED
        value: "false"
