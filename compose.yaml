services:
  swarnabhoomi:
    build: .
    container_name: swarnabhoomi-app
    restart: unless-stopped
    environment:
      H2_FILE_PATH: /var/data/swarnabhoomi
      H2_USER: ${H2_USER:-sa}
      H2_PASSWORD: ${H2_PASSWORD:-}
      APP_ACCESS_ENABLED: ${APP_ACCESS_ENABLED:-false}
      APP_ACCESS_USERNAME: ${APP_ACCESS_USERNAME:-swarnabhoomi}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      UPLOAD_DIR: /var/data/uploads
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_REMINDER_TEMPLATE: ${WHATSAPP_REMINDER_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-mr}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      GOOGLE_CLOUD_TTS_CREDENTIALS_JSON: ${GOOGLE_CLOUD_TTS_CREDENTIALS_JSON:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:file:/var/data/swarnabhoomi;DB_CLOSE_DELAY=-1}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.h2.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${H2_USER:-sa}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${H2_PASSWORD:-}}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_BACKUP_ENABLED: ${DATABASE_BACKUP_ENABLED:-false}
      DATABASE_BACKUP_CRON: ${DATABASE_BACKUP_CRON:-0 0 2 * * *}
      DB_BACKUP_DIRECTORY: ${DB_BACKUP_DIRECTORY:-/var/data/backups}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - swarnabhoomi-h2-data:/var/data

  caddy:
    profiles:
      - public
    image: caddy:2-alpine
    container_name: swarnabhoomi-caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - swarnabhoomi

  ollama:
    profiles:
      - ai
    image: ollama/ollama:latest
    container_name: swarnabhoomi-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  caddy-config:
  caddy-data:
  swarnabhoomi-h2-data:
  ollama-data:
