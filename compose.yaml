services:
  swarnabhoomi:
    build: .
    container_name: swarnabhoomi-app
    restart: unless-stopped
    environment:
      H2_FILE_PATH: /var/data/swarnabhoomi
      UPLOAD_DIR: /var/data/uploads
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_REMINDER_TEMPLATE: ${WHATSAPP_REMINDER_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-mr}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - swarnabhoomi-h2-data:/var/data

volumes:
  swarnabhoomi-h2-data:
