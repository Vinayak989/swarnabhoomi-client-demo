services:
  postgres:
    image: postgres:16
    container_name: swarnabhoomi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swarnabhoomi
      POSTGRES_USER: root
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - swarnabhoomi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  swarnabhoomi-postgres-data:
