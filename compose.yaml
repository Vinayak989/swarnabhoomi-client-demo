services:
  swarnabhoomi:
    build: .
    container_name: swarnabhoomi-app
    restart: unless-stopped
    environment:
      H2_FILE_PATH: /var/data/swarnabhoomi
      UPLOAD_DIR: /var/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - swarnabhoomi-h2-data:/var/data

volumes:
  swarnabhoomi-h2-data:
