services:
  mysql:
    image: mysql:8.4
    container_name: swarnabhoomi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: swarnabhoomi
      MYSQL_USER: swarnabhoomi_app
      MYSQL_PASSWORD: local-dev-password
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      # Keep the optional container beside the native MySQL service on port 3306.
      - "127.0.0.1:3307:3306"
    volumes:
      - swarnabhoomi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  swarnabhoomi-mysql-data:
