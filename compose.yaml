services:
  swarnabhoomi:
    build: .
    container_name: swarnabhoomi-app
    restart: unless-stopped
    environment:
      H2_FILE_PATH: /var/data/swarnabhoomi
      H2_USER: ${H2_USER:-sa}
      H2_PASSWORD: ${H2_PASSWORD:-}
      APP_ACCESS_ENABLED: ${APP_ACCESS_ENABLED:-false}
      APP_ACCESS_USERNAME: ${APP_ACCESS_USERNAME:-swarnabhoomi}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      UPLOAD_DIR: /var/data/uploads
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-https://swarnabhoomi-demo.onrender.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:file:/var/data/swarnabhoomi;DB_CLOSE_DELAY=-1}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.h2.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${H2_USER:-sa}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${H2_PASSWORD:-}}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      DATABASE_BACKUP_ENABLED: ${DATABASE_BACKUP_ENABLED:-false}
      DATABASE_BACKUP_CRON: ${DATABASE_BACKUP_CRON:-0 0 2 * * *}
      DB_BACKUP_DIRECTORY: ${DB_BACKUP_DIRECTORY:-/var/data/backups}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - swarnabhoomi-h2-data:/var/data

volumes:
  swarnabhoomi-h2-data:
