server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:swarnabhoomi}?allowPublicKeyRetrieval=true&sslMode=${MYSQL_SSL_MODE:DISABLED}&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:local-dev-password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.access.enabled=${APP_ACCESS_ENABLED:false}
app.access.username=${APP_ACCESS_USERNAME:demo}
app.access.password=${APP_ACCESS_PASSWORD:}
