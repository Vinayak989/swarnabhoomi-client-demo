server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${H2_FILE_PATH:./data/swarnabhoomi};DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_USER:sa}
spring.datasource.password=${H2_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.access.enabled=${APP_ACCESS_ENABLED:false}
app.access.username=${APP_ACCESS_USERNAME:demo}
app.access.password=${APP_ACCESS_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.reminders.poll-interval-ms=${REMINDER_POLL_INTERVAL_MS:15000}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
app.whatsapp.reminder-template=${WHATSAPP_REMINDER_TEMPLATE:}
app.whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:mr}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}
app.google.tts.credentials-json=${GOOGLE_CLOUD_TTS_CREDENTIALS_JSON:}
app.public-url=${APP_PUBLIC_URL:}
