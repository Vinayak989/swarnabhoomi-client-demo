server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:swarnabhoomi}?sslmode=${POSTGRES_SSL_MODE:disable}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:swarnabhoomi_app}
spring.datasource.password=${POSTGRES_PASSWORD:local-dev-password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.access.enabled=${APP_ACCESS_ENABLED:false}
app.access.username=${APP_ACCESS_USERNAME:demo}
app.access.password=${APP_ACCESS_PASSWORD:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
